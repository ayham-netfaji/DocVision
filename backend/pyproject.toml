[project]
name = "docvision-backend"
version = "1.0.0"
description = "DocVision Computer Vision Document Scanner & OCR Backend"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "B008",  # FastAPI Depends and File default argument pattern
    "E501",  # Line length handled gracefully
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
